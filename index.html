<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bautizo de Julián</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Great+Vibes&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #14213D;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 12px 40px;
      font-family: 'Cinzel', serif;
    }
    #tarjeta {
      width: 600px;
      height: 800px;
      background-image: url('fondo_bautizo.jpg');
      background-size: 100% 100%;
      background-repeat: no-repeat;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      color: #9c7e44;
      box-shadow: 0 20px 50px rgba(0,0,0,0.45);
      overflow: hidden;
    }
    .bloque-superior {
      margin-top: 86px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .subtitulo-top {
      font-size: 11px;
      letter-spacing: 3.5px;
      line-height: 1.8;
      color: #9c7e44;
    }
    .titulo-script {
      font-family: 'Great Vibes', cursive;
      font-size: 82px;
      color: #9c7e44;
      line-height: 0.95;
      margin: 4px 0 6px;
      font-weight: 400;
    }
    .de-nuestro {
      font-size: 11px;
      letter-spacing: 4px;
      color: #9c7e44;
    }
    .bloque-inferior {
      margin-top: 245px;
      width: 82%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .nombre-julian {
      font-family: 'Great Vibes', cursive;
      font-size: 86px;
      color: #9c7e44;
      line-height: 0.9;
      margin-bottom: 10px;
      font-weight: 400;
    }
    .sus-padres {
      font-size: 10.5px;
      letter-spacing: 4.5px;
      color: #9c7e44;
      margin-bottom: 4px;
    }
    .nombres-padres {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 25px;
      font-weight: 600;
      color: #9c7e44;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
    }
    .frase-invitacion {
      font-size: 9.8px;
      letter-spacing: 2.3px;
      line-height: 1.7;
      color: #9c7e44;
      max-width: 440px;
      margin-bottom: 24px;
    }
    .fecha-grid {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      width: 390px;
      margin-bottom: 22px;
      color: #9c7e44;
    }
    .dia-semana, .hora {
      font-size: 12px;
      letter-spacing: 3px;
      color: #9c7e44;
    }
    .centro-fecha {
      border-left: 1px solid #9c7e44;
      border-right: 1px solid #9c7e44;
      padding: 2px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .numero-dia {
      font-family: 'Cormorant Garamond', serif;
      font-size: 36px;
      font-weight: 600;
      line-height: 1;
      color: #9c7e44;
    }
    .mes-anio {
      font-size: 10px;
      letter-spacing: 2.8px;
      margin-top: 3px;
      color: #9c7e44;
    }
    .lugar {
      font-size: 10.5px;
      letter-spacing: 2.5px;
      line-height: 1.7;
      color: #9c7e44;
    }
    .btn-descargar {
      margin-top: 22px;
      padding: 14px 28px;
      background: #E5E5E5;
      color: #14213D;
      border: none;
      border-radius: 50px;
      font-family: 'Cinzel', serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 1.5px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0,0,0,0.35);
    }
    .btn-descargar:active { transform: scale(0.97); }
    @media (max-width: 630px) {
      #tarjeta { transform: scale(0.58); transform-origin: top center; margin-bottom: -320px; }
    }
  </style>
</head>
<body>

  <div id="tarjeta">
    <div class="bloque-superior">
      <p class="subtitulo-top">CON MUCHO AMOR<br>TE INVITAMOS AL</p>
      <h1 class="titulo-script">Bautizo</h1>
      <p class="de-nuestro">DE NUESTRO HIJO</p>
    </div>

    <div class="bloque-inferior">
      <h2 class="nombre-julian">Julián</h2>
      <p class="sus-padres">SUS PADRES</p>
      <p class="nombres-padres">Giuliana Rodríguez y Luis Mejía</p>
      <p class="frase-invitacion">TE INVITAN A ACOMPAÑARLO A CELEBRAR<br>EL INICIO DE SU CAMINO EN LA FE</p>

      <div class="fecha-grid">
        <span class="dia-semana">VIERNES</span>
        <div class="centro-fecha">
          <span class="numero-dia">04</span>
          <span class="mes-anio">DICIEMBRE 2026</span>
        </div>
        <span class="hora">3:00 P.M.</span>
      </div>

      <p class="lugar">PARROQUIA SANTA TERESITA DEL NIÑO JESÚS<br>CERCADO DE LIMA (SANTA BEATRIZ)</p>
    </div>
  </div>

  <button class="btn-descargar" onclick="descargarImagen()">⬇ DESCARGAR INVITACIÓN (HD)</button>

  <script>
    function descargarImagen() {
      const card = document.getElementById('tarjeta');
      const prevTransform = card.style.transform;
      const prevMargin = card.style.marginBottom;
      card.style.transform = 'none';
      card.style.marginBottom = '0';

      html2canvas(card, { scale: 3, useCORS: true }).then(canvas => {
        card.style.transform = prevTransform;
        card.style.marginBottom = prevMargin;
        const link = document.createElement('a');
        link.download = 'Bautizo-Julian.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }
  </script>
</body>
</html>
